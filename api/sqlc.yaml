version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "sql/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_params_struct_pointers: false
        emit_result_struct_pointers: false
        emit_interface: false
