name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/minipaas-server-${GOOS}-${GOARCH}${EXTENSION}" ./api/cmd/server
          go build -trimpath -ldflags="-s -w" -o "dist/minipaas-migrate-${GOOS}-${GOARCH}${EXTENSION}" ./api/cmd/migrate
          (cd cli && go build -trimpath -ldflags="-s -w" -o "../dist/minip-${GOOS}-${GOARCH}${EXTENSION}" .)
      - uses: actions/upload-artifact@v4
        with:
          name: minipaas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
